name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy via Service Account or Token
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_NABIL_BARAKAT }}
          CI_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'nabil-barakat-website' }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "::notice ::جاري المصادقة ونشر الموقع باستخدام حساب الخدمة المعتمد..."
            echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service_account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service_account.json"
            npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID" --non-interactive
          elif [ -n "$CI_TOKEN" ]; then
            echo "::notice ::جاري المصادقة ونشر الموقع باستخدام FIREBASE_TOKEN..."
            npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID" --token "$CI_TOKEN" --non-interactive
          else
            echo "::error ::لم يتم العثور على أي مفتاح مصادقة في GitHub Secrets (FIREBASE_SERVICE_ACCOUNT أو FIREBASE_TOKEN)!"
            exit 1
          fi
